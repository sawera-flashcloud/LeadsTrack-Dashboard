
<!-- MATON MEETINGS -->
<div class="tab-content" id="tab-meetings">
  <div class="flex align-center gap8 mb16">
    <div class="section-title" style="margin-bottom:0">📅 Meetings</div>
    <span style="font-size:11px;padding:3px 10px;border-radius:20px;background:rgba(124,109,250,.12);color:var(--accent)">Google Calendar</span>
    <button class="btn-sm ml-auto" onclick="loadMeetings()">🔄 Refresh</button>
  </div>

  <!-- Summary row -->
  <div class="grid-4 mb16" id="mtg-summary">
    <div class="grid-card"><div style="font-size:24px;font-weight:700;color:var(--success)" id="mtg-upcoming">—</div><div style="font-size:11px;color:var(--text-muted)">Upcoming</div></div>
    <div class="grid-card"><div style="font-size:24px;font-weight:700;color:var(--accent)" id="mtg-today">—</div><div style="font-size:11px;color:var(--text-muted)">Today</div></div>
    <div class="grid-card"><div style="font-size:24px;font-weight:700" id="mtg-past">—</div><div style="font-size:11px;color:var(--text-muted)">This Week</div></div>
    <div class="grid-card"><div style="font-size:24px;font-weight:700;color:var(--warning)" id="mtg-attendees">—</div><div style="font-size:11px;color:var(--text-muted)">People</div></div>
  </div>

  <!-- Schedule list -->
  <div id="mtg-list" class="scrollable-meetings" style="max-height:65vh;overflow-y:auto">
    <div style="text-align:center;padding:40px;color:var(--text-muted)"><span class="spinner"></span> Loading meetings...</div>
  </div>
</div>
